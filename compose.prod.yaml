name: flags-api-prod

services:
  migrate:
    image: henriqueholtz/fc4-desafio-docker-node-api:1.0.0
    env_file: .env
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    image: henriqueholtz/fc4-desafio-docker-node-api:1.0.0
    env_file: .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - backend

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - backend

networks:
  backend:
    name: flags-api-prod-network

volumes:
  pgdata:
